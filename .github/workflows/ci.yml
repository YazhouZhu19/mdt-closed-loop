name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile sources
        run: python -m compileall -q mdt_core tests examples demo.py

      - name: Lint
        run: ruff check mdt_core tests examples demo.py docs/LEARNING_BANDIT_EXAMPLE.py

      - name: Type-check local sources
        run: mypy --no-site-packages --ignore-missing-imports mdt_core tests examples demo.py

      - name: Run isolated synthetic tests
        run: python -W error -m unittest discover -s tests -v

      - name: Run isolated synthetic demonstration
        if: matrix.python-version == '3.12'
        run: python demo.py

      - name: Run offline learning example
        if: matrix.python-version == '3.12'
        run: python -m docs.LEARNING_BANDIT_EXAMPLE

      - name: Run execution-contract and exact-OPE examples
        if: matrix.python-version == '3.12'
        run: |
          python examples/v21_contract_demo.py
          python examples/v22_operator_ope_sanity.py

      - name: Run constructed evidence audit
        if: matrix.python-version == '3.12'
        run: python -m mdt_core.evidence_cli examples/v22_audit_manifest.json --output "$RUNNER_TEMP/mdt-evidence-audit.json"
