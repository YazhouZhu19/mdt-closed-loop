name: Bug report
description: Report a reproducible software defect using synthetic data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include participant data, credentials, API keys, or private study material.
        Report security and safety-sensitive issues through the private process in SECURITY.md.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Provide minimal steps or synthetic input only.
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Python, operating system, NumPy, and SciPy versions
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: Affected area
      options:
        - Signal processing
        - State estimation
        - Target planning
        - PI control or music grammar
        - Session lifecycle or recording
        - Safety, outcome, or research arm
        - Packaging, documentation, or CI
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Data confirmation
      options:
        - label: This report contains synthetic data only and no secrets or participant records.
          required: true
